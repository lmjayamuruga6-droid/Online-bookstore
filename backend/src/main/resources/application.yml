
server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:bookstore
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-that-should-be-overridden-in-prod-must-be-32+chars-long}
    expiration-ms: 86400000

logging:
  level:
    com.bookstore: DEBUG
